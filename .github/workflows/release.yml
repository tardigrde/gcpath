name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    environment:
      name: pypi
      url: https://pypi.org/project/gcpath/
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Semantic Release
      id: semantic_release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        before=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        uv tool run --no-build --from 'python-semantic-release==9.21.2' semantic-release version
        after=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "$before" = "$after" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "No release needed (version remains $after)."
        else
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Released $before -> $after"
          uv tool run --no-build --from 'python-semantic-release==9.21.2' semantic-release publish
        fi
    
    - name: Build package
      if: steps.semantic_release.outputs.released == 'true'
      run: uv build
    
    - name: Publish to PyPI
      if: steps.semantic_release.outputs.released == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
